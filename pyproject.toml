[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qbanknote"
version = "0.1.0"
description = "Shared utilities for the Quantum Banknote Classifier project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "scikit-learn",
    "torch",
    "ucimlrepo",
    "qiskit>=2.0,<3.0",
    "qiskit-machine-learning>=0.9,<0.10",
    "iqm-client[qiskit]>=33.0,<34.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "qiskit-aer>=0.15.0",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
