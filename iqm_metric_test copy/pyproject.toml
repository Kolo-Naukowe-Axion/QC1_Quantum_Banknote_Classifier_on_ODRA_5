version = "0.1.0"
description = "IQM Spark ansatz evaluation (ODRA vs simulator) with checkpoint-safe CSV outputs"
requires-python = "==3.12.*"
dependencies = [
    "sympy>=1.13.0,<1.14",
    "numpy==2.4.3",
    "pandas>=2.2.0,<3",
    "scikit-learn==1.8.0",
    "torch>=2.6.0,<2.10",
    "qiskit==2.1.2",
    "qiskit-machine-learning==0.9.0",
    "qiskit-algorithms==0.4.0",
    "iqm-client[qiskit]==34.0.1",
]

[tool.uv]
package = false
